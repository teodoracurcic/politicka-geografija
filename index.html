<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesta i izbori u Srbiji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4;--surface:#FFFFFF;--ink:#16233A;--muted:#5E6B7E;--line:#D5DBE3;
  --a:#1F4FB8;--b:#0E7C74;--rest:#C9D0DA;
  --s1:#16233A;--s2:#1F4FB8;--s3:#5B82D6;--s4:#0E7C74;--s5:#7FB8B2;--s6:#A9B7CC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121821;--surface:#1A2230;--ink:#E6EBF2;--muted:#93A0B3;--line:#2A3444;
    --a:#7EA2F2;--b:#4FC1B6;--rest:#364152;
    --s1:#E6EBF2;--s2:#7EA2F2;--s3:#4A6DB8;--s4:#4FC1B6;--s5:#2F7D76;--s6:#5A6678;
  }
}
:root[data-theme="dark"]{
  --bg:#121821;--surface:#1A2230;--ink:#E6EBF2;--muted:#93A0B3;--line:#2A3444;
  --a:#7EA2F2;--b:#4FC1B6;--rest:#364152;
  --s1:#E6EBF2;--s2:#7EA2F2;--s3:#4A6DB8;--s4:#4FC1B6;--s5:#2F7D76;--s6:#5A6678;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Onest,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1320px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end}
h1{font-size:1.05rem;margin:0 auto 6px 0;font-weight:600}
label.pick{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
select{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:240px;max-width:100%}
label.pick.a select{border-left:4px solid var(--a)}
label.pick.b select{border-left:4px solid var(--b)}
select:focus-visible,button:focus-visible{outline:2px solid var(--a);outline-offset:2px}
main{max-width:1320px;margin:0 auto;padding:20px}
.years{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.years span{font-size:.85rem;color:var(--muted);align-self:center;margin-right:6px}
.years button{font:inherit;font-size:.85rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.years button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cols{display:grid;grid-template-columns:1fr;gap:24px}
.cols.two{grid-template-columns:1fr 1fr}
@media (max-width:900px){.cols.two{grid-template-columns:1fr}}
.col{min-width:0}
.place{border-top:6px solid var(--a);padding-top:12px;margin-bottom:18px}
.col.b .place{border-top-color:var(--b)}
.place h2{font-size:clamp(1.8rem,3.4vw,2.7rem);line-height:1.05;margin:0;font-weight:700;letter-spacing:-.02em}
.place .lvl{color:var(--muted);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:22px}
.kpi{padding:12px 14px;box-shadow:inset -1px -1px 0 var(--line)}
.kpi b{display:block;font-size:1.45rem;font-weight:600;line-height:1.15}
.kpi small{color:var(--muted);font-size:.8rem}
section{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:18px}
section h3{font-size:1rem;margin:0 0 2px;font-weight:600}
section .sub{color:var(--muted);font-size:.82rem;margin:0 0 12px}
.strip{display:grid;grid-template-columns:86px 1fr;gap:5px 10px;align-items:center}
.strip .yr{font-size:.82rem;color:var(--muted);background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;font-size:.82rem}
.strip .yr.on{color:var(--ink);font-weight:600}
.sbar{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--rest);cursor:pointer}
.sbar.on{outline:2px solid var(--ink);outline-offset:1px}
.sbar i{display:block;height:100%}
.sbar.none{background:repeating-linear-gradient(45deg,transparent 0 5px,var(--line) 5px 6px);cursor:default}
.res{margin-top:16px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:2px 10px;margin-bottom:9px}
.row .nm{font-size:.86rem;overflow-wrap:anywhere}
.row .pc{text-align:right;font-weight:600;font-size:.9rem}
.row .tr{grid-column:1/-1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.row .tr i{display:block;height:100%;background:var(--a);border-radius:4px}
.col.b .row .tr i{background:var(--b)}
.row .vt{grid-column:1/-1;font-size:.76rem;color:var(--muted)}
.more{font:inherit;font-size:.85rem;background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr 70px;gap:4px 10px;align-items:center;font-size:.85rem;margin-bottom:5px}
.hb .tr{height:12px;background:var(--bg);border-radius:3px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--a)}
.col.b .hb .tr i{background:var(--b)}
.hb .v{text-align:right;color:var(--muted)}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--muted);font-size:11px;font-family:inherit}
.empty{color:var(--muted);font-size:.9rem;margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 18px}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.82rem;padding:6px 9px;border-radius:6px;max-width:280px;line-height:1.3;opacity:0;transition:opacity .08s}
#tip.on{opacity:1}
#tip b{font-weight:600}
[data-tip]{cursor:pointer}
svg.ch rect.bar[data-tip]:hover,svg.ch rect.bar.hl{opacity:.7}
svg.ch line.guide{opacity:0}
svg.ch g.pt:hover line.guide,svg.ch g.pt.hl line.guide{opacity:1}
svg.ch g.pt:hover circle,svg.ch g.pt.hl circle{r:5.5}
.sbar i[data-tip]:hover{filter:brightness(1.25)}
.cols:not(.two) .demo{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:0 18px;align-items:start}
@media (max-width:900px){.cols:not(.two) .demo{grid-template-columns:1fr}}
footer{max-width:1320px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:.8rem}
</style>
</head>

<script>
const DB=JSON.parse(document.getElementById('data').textContent);
const LVL={drzava:'Država',region:'Region',okrug:'Okrug',grad:'Grad','gradska opstina':'Gradska opština',opstina:'Opština',ostalo:'Ostalo'};
const LVLP={drzava:'Država',region:'Regioni',okrug:'Okruzi',grad:'Gradovi','gradska opstina':'Gradske opštine',opstina:'Opštine',ostalo:'Ostalo'};
const nf=new Intl.NumberFormat('sr-Latn-RS');
const f=n=>nf.format(n);
const fp=n=>n.toLocaleString('sr-Latn-RS',{minimumFractionDigits:1,maximumFractionDigits:1});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SH=['--s1','--s2','--s3','--s4','--s5','--s6'];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let st={a:0,b:-1,e:DB.E.length-1,all:{}};
const sa=+store.get('mi_a'), sb=store.get('mi_b');
if(DB.P[sa]) st.a=sa;
if(sb!==null && (+sb===-1 || DB.P[+sb])) st.b=+sb;

function fillSelect(sel,withNone){
  let h=withNone?'<option value="-1">(bez poređenja)</option>':'';
  let cur=null;
  DB.P.forEach((p,i)=>{
    if(p.l!==cur){ if(cur!==null) h+='</optgroup>'; h+=`<optgroup label="${LVLP[p.l]}">`; cur=p.l; }
    h+=`<option value="${i}">${esc(p.n)}</option>`;
  });
  sel.innerHTML=h+'</optgroup>';
}
const selA=document.getElementById('selA'), selB=document.getElementById('selB');
fillSelect(selA,false); fillSelect(selB,true);
selA.value=st.a; selB.value=st.b;
selA.onchange=()=>{st.a=+selA.value;store.set('mi_a',st.a);render()};
selB.onchange=()=>{st.b=+selB.value;store.set('mi_b',st.b);render()};

function years(){
  const el=document.getElementById('years');
  el.innerHTML='<span>Izbori</span>'+DB.E.map((d,i)=>`<button type="button" data-e="${i}" aria-pressed="${i===st.e}" title="${d}">${d.slice(6,11)}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{st.e=+b.dataset.e;render()});
}

function lastKey(o){const k=Object.keys(o||{}).map(Number);return k.length?Math.max(...k):null}

function kpis(p){
  const out=[];
  if(p.pop) out.push([f(p.pop[0]),'stanovnika (2022)']);
  const zy=lastKey(p.zar); if(zy) out.push([f(p.zar[zy])+' din',`prosečna neto zarada (${zy})`]);
  const ry=lastKey(p.rod);
  if(ry){ out.push([f(p.rod[ry]),`rođenih (${ry})`]);
    if(p.pop&&p.pop[0]) out.push([fp(p.rod[ry]/p.pop[0]*1000),`rođenih na 1.000 stanovnika`]); }
  if(p.dos&&p.pop&&p.pop[0]&&p.dos.t['Doseljeno stanovništvo - ukupno']!=null)
    out.push([fp(p.dos.t['Doseljeno stanovništvo - ukupno']/p.pop[0]*100)+'%','stanovnika su doseljeni']);
  if(!out.length) return '';
  return '<div class="kpis">'+out.map(([v,l])=>`<div class="kpi"><b>${v}</b><small>${l}</small></div>`).join('')+'</div>';
}

function elections(p,ci){
  if(!p.e) return `<section><h3>Izbori</h3><p class="empty">Nema izbornih podataka za ovo mesto.</p></section>`;
  let strip='<div class="strip">';
  DB.E.forEach((d,i)=>{
    const r=p.e[i];
    strip+=`<button type="button" class="yr${i===st.e?' on':''}" data-e="${i}">${d.slice(0,10)}</button>`;
    if(!r){strip+=`<div class="sbar none" title="Nema podataka"></div>`;return;}
    let segs=r.slice(0,6).map((x,k)=>`<i style="width:${x[2]}%;background:var(${SH[k]})" data-tip="<b>${esc(DB.L[x[0]])}</b><br>${fp(x[2])}% · ${f(x[1])} glasova"></i>`).join('');
    strip+=`<div class="sbar${i===st.e?' on':''}" data-e="${i}" role="button" tabindex="0" aria-label="Izbori ${d}, pobednik ${esc(DB.L[r[0][0]])} ${fp(r[0][2])}%">${segs}</div>`;
  });
  strip+='</div>';
  const r=p.e[st.e];
  let res;
  if(!r) res=`<p class="empty">Za izbore ${DB.E[st.e]} nema podataka za ovo mesto.</p>`;
  else{
    const key=ci+'|'+st.e, all=st.all[key];
    const max=r[0][2]||1;
    const big=r.filter(x=>x[2]>=1), show=all?r:big, hidden=r.length-big.length;
    res=show.map(x=>`<div class="row"><div class="nm">${esc(DB.L[x[0]])}</div><div class="pc">${fp(x[2])}%</div><div class="tr"><i style="width:${x[2]/max*100}%"></i></div><div class="vt">${f(x[1])} glasova</div></div>`).join('');
    if(hidden>0) res+=`<button type="button" class="more" data-k="${key}">${all?'Sakrij liste ispod 1%':`Prikaži još ${hidden} ${hidden===1?'listu':'lista'} ispod 1%`}</button>`;
  }
  return `<section><h3>Izbori kroz vreme</h3><p class="sub">Svaka traka su jedni izbori; najtamniji deo je lista koja je osvojila najviše glasova. Klikni na traku za detalje.</p>${strip}
  <div class="res"><h3>Rezultati ${DB.E[st.e]}</h3><p class="sub">Procenat od ukupnog broja glasalih</p>${res}</div></section>`;
}

function nice(m){const p=Math.pow(10,Math.floor(Math.log10(m/3)));const s=[1,2,2.5,5,10].map(x=>x*p).find(x=>x*3>=m);return s*3}
function lineChart(o,unit){
  const k=Object.keys(o).map(Number).sort((a,b)=>a-b); if(!k.length) return '';
  const W=520,H=190,L=58,R=12,T=14,B=26,vals=k.map(y=>o[y]);
  const mx=nice(Math.max(...vals)*1.05), mn=0;
  const x=i=>L+(k.length===1?0:i*(W-L-R)/(k.length-1)), y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  let g='';
  for(let t=0;t<=3;t++){const v=mn+(mx-mn)*t/3;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${f(Math.round(v/1000))}k</text>`;}
  k.forEach((yr,i)=>g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${String(yr).slice(2)}</text>`);
  const pts=k.map((yr,i)=>`${x(i)},${y(o[yr])}`).join(' ');
  g+=`<polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2.5"/>`;
  k.forEach((yr,i)=>{const hw=(W-L-R)/Math.max(k.length-1,1)/2;g+=`<g class="pt" data-tip="<b>${yr}.</b><br>${f(o[yr])} ${unit}" tabindex="0"><rect x="${x(i)-hw}" y="${T}" width="${hw*2}" height="${H-T-B}" fill="transparent"/><line class="guide" x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H-B}" stroke="currentColor" stroke-dasharray="3 3"/><circle cx="${x(i)}" cy="${y(o[yr])}" r="3.5" fill="currentColor"/></g>`});
  const lk=k[k.length-1];
  g+=`<text x="${x(k.length-1)}" y="${y(o[lk])-9}" text-anchor="end" style="fill:currentColor;font-weight:600">${f(o[lk])}</text>`;
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafikon">${g}</svg>`;
}
function barChart(o){
  const k=Object.keys(o).map(Number).sort((a,b)=>a-b); if(!k.length) return '';
  const W=520,H=190,L=46,R=8,T=18,B=26, mx=nice(Math.max(...k.map(y=>o[y]))*1.05||1);
  const bw=(W-L-R)/k.length;
  let g='';
  for(let t=0;t<=3;t++){const v=mx*t/3, yy=T+(1-t/3)*(H-T-B);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${f(Math.round(v))}</text>`;}
  k.forEach((yr,i)=>{const h=o[yr]/mx*(H-T-B), xx=L+i*bw+bw*.18;
    g+=`<rect x="${xx}" y="${H-B-h}" width="${bw*.64}" height="${h}" rx="2" fill="currentColor" class="bar" tabindex="0" data-tip="<b>${yr}.</b><br>${f(o[yr])} rođenih"></rect><text x="${xx+bw*.32}" y="${H-8}" text-anchor="middle">${String(yr).slice(2)}</text>`;});
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafikon">${g}</svg>`;
}
function hbars(items,total){
  const mx=Math.max(...items.map(x=>x[1]),1);
  return items.map(([n,v])=>`<div class="hb"><span>${esc(n)}</span><div class="tr"><i style="width:${v/mx*100}%"></i></div><span class="v">${total?fp(v/total*100)+'%':f(v)}</span></div>`).join('');
}

function demo(p){
  let h='';
  if(p.zar) h+=`<section class="c"><h3>Prosečna neto zarada</h3><p class="sub">Dinara mesečno, po godinama</p>${lineChart(p.zar,'din')}</section>`;
  if(p.rod) h+=`<section class="c"><h3>Broj rođenih</h3><p class="sub">Živorođeni po godinama</p>${barChart(p.rod)}</section>`;
  if(p.pop){
    const n=p.nac.slice(0,7), rest=p.nac.slice(7).reduce((s,x)=>s+x[1],0);
    if(rest) n.push(['Ostale grupe',rest]);
    h+=`<section><h3>Stanovništvo (popis 2022)</h3><p class="sub">${f(p.pop[1])} muškaraca, ${f(p.pop[2])} žena${p.urb&&p.pop[0]?`; ${fp(p.urb[0]/p.pop[0]*100)}% živi u gradskim naseljima`:''}</p>${hbars(n,p.pop[0])}</section>`;
  }
  if(p.dos){
    const t=p.dos.t, tot=t['Doseljeno stanovništvo - ukupno'];
    const orig=[['Iz drugog naselja iste opštine',t['Doseljeno sa područja Republike Srbije - iz drugog naselja iste opštine']],
      ['Iz druge opštine iste oblasti',t['Doseljeno sa područja Republike Srbije - iz druge opštine u istoj oblasti']],
      ['Iz druge oblasti Srbije',t['Doseljeno sa područja Republike Srbije - iz druge oblasti']],
      ['Iz BiH',t['Doseljeno iz inostranstva - iz Bosne i Hercegovine']],
      ['Iz Hrvatske',t['Doseljeno iz inostranstva - iz Hrvatske']],
      ['Iz Crne Gore',t['Doseljeno iz inostranstva - iz Crne Gore']],
      ['Iz S. Makedonije',t['Doseljeno iz inostranstva - iz Severne Makedonije']],
      ['Iz Slovenije',t['Doseljeno iz inostranstva - iz Slovenije']],
      ['Iz drugih država',t['Doseljeno iz inostranstva - iz drugih država']]].filter(x=>x[1]);
    h+=`<section><h3>Doseljeni (popis 2022)</h3><p class="sub">${f(tot||0)} doseljenih ukupno; udeo među doseljenima</p>${hbars(orig,tot)}
    <p class="sub" style="margin-top:14px">Kada su se doselili</p>${hbars(p.dos.v.map(x=>[x[0].replace(/\.$/,''),x[1]]),tot)}</section>`;
  }
  return h;
}

function column(i,side){
  const p=DB.P[i];
  return `<div class="col ${side}"><div class="place"><h2>${esc(p.n)}</h2><div class="lvl">${LVL[p.l]}</div></div>
  ${kpis(p)}${elections(p,side)}<div class="demo">${demo(p)||'<section><p class="empty">Za ovo mesto nema demografskih podataka.</p></section>'}</div></div>`;
}

function render(){
  years();
  const c=document.getElementById('cols');
  const two=st.b>=0;
  c.className='cols'+(two?' two':'');
  c.innerHTML=column(st.a,'a')+(two?column(st.b,'b'):'');
  c.querySelectorAll('.col').forEach(col=>col.style.color='');
  c.querySelectorAll('.col.a svg.ch').forEach(s=>s.style.color='var(--a)');
  c.querySelectorAll('.col.b svg.ch').forEach(s=>s.style.color='var(--b)');
  c.querySelectorAll('[data-e]').forEach(b=>{
    const go=()=>{st.e=+b.dataset.e;render()};
    b.addEventListener('click',go);
    b.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();go()}});
  });
  c.querySelectorAll('.more').forEach(b=>b.onclick=()=>{st.all[b.dataset.k]=!st.all[b.dataset.k];render()});
}
render();
const tip=document.getElementById('tip'); let pinned=null;
function showTip(el,ev){
  tip.innerHTML=el.dataset.tip; tip.classList.add('on');
  const r=el.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight;
  let cx=ev&&ev.clientX!=null&&ev.type!=='focusin'?ev.clientX:r.left+r.width/2;
  let top=(ev&&ev.clientY!=null&&ev.type!=='focusin'?ev.clientY:r.top)-th-12;
  if(top<8) top=r.bottom+10;
  tip.style.left=Math.max(8,Math.min(innerWidth-tw-8,cx-tw/2))+'px'; tip.style.top=top+'px';
}
function hideTip(){tip.classList.remove('on');document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'))}
document.addEventListener('pointermove',ev=>{
  if(pinned) return;
  const el=ev.target.closest&&ev.target.closest('[data-tip]');
  if(el) showTip(el,ev); else hideTip();
});
document.addEventListener('click',ev=>{
  const el=ev.target.closest&&ev.target.closest('[data-tip]');
  if(el){ if(pinned===el){pinned=null;hideTip();return;} hideTip(); pinned=el; el.classList.add('hl'); showTip(el,ev);}
  else if(pinned){pinned=null;hideTip();}
},true);
document.addEventListener('focusin',ev=>{const el=ev.target.closest('[data-tip]'); if(el) showTip(el,ev);});
document.addEventListener('focusout',()=>{if(!pinned) hideTip()});
addEventListener('scroll',()=>{pinned=null;hideTip()},{passive:true});
</script>
</body>
</html>
